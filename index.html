<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>AYTEAM | 顶奢买手工作室</title>

  <!-- Meta Pixel Code -->
  <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '1498332425017207');
    fbq('track', 'PageView');
  </script>
  <noscript>
    <img height="1" width="1" style="display:none"
      src="https://www.facebook.com/tr?id=1498332425017207&ev=PageView&noscript=1" />
  </noscript>

  <style>
    :root {
      --gold: #d4af37;
      --gold-light: #f3e5ab;
      --bg-dark: #0f0f11;
      --card-bg: #18191c;
      --text-main: #f5f5f7;
      --text-sub: #8e8e93;
      --border-color: #2c2d30;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: radial-gradient(circle at 50% 15%, #222328 0%, var(--bg-dark) 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      color: var(--text-main);
    }

    .card {
      width: 100%;
      max-width: 400px;
      background: var(--card-bg);
      border-radius: 24px;
      border: 1px solid rgba(212, 175, 55, 0.25);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 20px rgba(212, 175, 55, 0.08);
      overflow: hidden;
      position: relative;
    }

    .top-gold-line {
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }

    .card-inner {
      padding: 26px 20px 22px;
      text-align: center;
    }

    .brand-tag {
      display: inline-block;
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--gold-light);
      background: rgba(212, 175, 55, 0.1);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 999px;
      padding: 5px 14px;
      margin-bottom: 16px;
      text-transform: uppercase;
      font-weight: 600;
    }

    .title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      color: #fff;
    }

    .subtitle {
      font-size: 13px;
      color: var(--text-sub);
      margin-bottom: 18px;
      line-height: 1.5;
    }

    .wxid-card {
      background: #111214;
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 16px 14px;
      margin-bottom: 16px;
      position: relative;
      transition: all 0.3s ease;
    }

    .wxid-card.flash {
      border-color: var(--gold);
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
      background: #1a1914;
    }

    .wx-label {
      font-size: 11px;
      letter-spacing: 1.5px;
      color: var(--gold);
      text-transform: uppercase;
      margin-bottom: 4px;
      font-weight: 600;
    }

    .wxid-text {
      font-size: 32px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 1.5px;
      font-family: -apple-system, SF Pro Display, sans-serif;
    }

    .copy-btn {
      width: 100%;
      border: none;
      border-radius: 999px;
      background: linear-gradient(135deg, #e5c05d, #c4962c);
      color: #0b0b0d;
      font-size: 16px;
      font-weight: 700;
      padding: 15px 20px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(196, 150, 44, 0.35);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .copy-btn:active {
      transform: scale(0.98);
      background: #b58925;
    }

    .tips {
      margin-top: 14px;
      font-size: 13px;
      line-height: 1.6;
      color: #999;
    }

    .tips .code {
      color: var(--gold-light);
      font-weight: 700;
      background: rgba(212, 175, 55, 0.15);
      padding: 2px 6px;
      border-radius: 4px;
    }

    /* GIF 演示动图容器 */
    .gif-wrapper {
      margin-top: 18px;
      border-radius: 14px;
      overflow: hidden;
      background: #111214;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
    }

    .gif {
      display: block;
      width: 100%;
      height: auto;
    }

    .fallback {
      display: none;
      padding: 16px;
      font-size: 13px;
      color: #aaa;
      line-height: 1.6;
      text-align: center;
    }

    .footer-note {
      margin-top: 16px;
      font-size: 11px;
      color: #555;
      line-height: 1.5;
    }

    .toast {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(-120px);
      background: rgba(212, 175, 55, 0.95);
      color: #0b0b0d;
      padding: 12px 24px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      z-index: 9999;
      transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none;
      white-space: nowrap;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div class="toast" id="toast"></div>

  <div class="card">
    <div class="top-gold-line"></div>

    <div class="card-inner">
      <div class="brand-tag">AYTEAM ATELIER · 现货对版</div>

      <div class="title">对接主理人买手微信</div>
      <div class="subtitle">全网带图找款 · 专属对版细节 · 顺丰现货直发</div>

      <div class="wxid-card" id="wxidCard">
        <div class="wx-label">WeChat ID</div>
        <div class="wxid-text" id="wxidText">N88385</div>
      </div>

      <button class="copy-btn" id="copyBtn">
        <span>📋</span> 点击一键复制微信号
      </button>

      <div class="tips">
        复制后打开微信 → 搜索添加<br />
        添加时发送暗号 <span class="code">【ins】</span> 优先通过
      </div>

      <!-- 保留原版 GIF 添加教程动图 -->
      <div class="gif-wrapper">
        <img
          class="gif"
          src="https://cdn.jsdelivr.net/gh/Jackayyy/AYTEAM@main/wx.GIF"
          alt="添加微信教程"
          onerror="this.style.display='none';document.getElementById('fallback').style.display='block';"
        />
        <div class="fallback" id="fallback">
          📱 打开微信 → 搜索 <strong>N88385</strong> → 添加好友
        </div>
      </div>

      <div class="footer-note">
        支持对版验货 / 一对一买手服务 / 全程顺丰保价直发
      </div>
    </div>
  </div>

  <script>
    const WX_ID = 'N88385';
    const copyBtn = document.getElementById('copyBtn');
    const wxidCard = document.getElementById('wxidCard');
    const toast = document.getElementById('toast');
    let toastTimer;
    let hasFired = false;

    function showToast(message) {
      if (toastTimer) clearTimeout(toastTimer);
      toast.textContent = message;
      toast.classList.add('show');
      toastTimer = setTimeout(() => {
        toast.classList.remove('show');
      }, 2500);
    }

    function flashBox() {
      wxidCard.classList.add('flash');
      setTimeout(() => {
        wxidCard.classList.remove('flash');
      }, 500);
    }

    function firePixelEvent() {
      if (hasFired) return;
      hasFired = true;

      // 同时回传标准事件与原自定义事件
      if (typeof fbq !== 'undefined') {
        fbq('track', 'Contact');
        fbq('trackCustom', 'add');
      }
    }

    function handleCopySuccess() {
      flashBox();
      showToast('✅ 微信号已复制！请打开微信搜索添加');
      firePixelEvent();

      // 尝试呼起微信
      setTimeout(() => {
        window.location.href = 'weixin://';
      }, 600);
    }

    function fallbackCopy() {
      const textarea = document.createElement('textarea');
      textarea.value = WX_ID;
      textarea.style.position = 'fixed';
      textarea.style.left = '-9999px';
      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();
      document.execCommand('copy');
      document.body.removeChild(textarea);
    }

    copyBtn.addEventListener('click', () => {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(WX_ID)
          .then(handleCopySuccess)
          .catch(() => {
            fallbackCopy();
            handleCopySuccess();
          });
      } else {
        fallbackCopy();
        handleCopySuccess();
      }
    });
  </script>
</body>
</html>
