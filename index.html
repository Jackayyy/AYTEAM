<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>添加微信好友</title>

  <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '1498332425017207');
    fbq('track', 'PageView');
  </script>
  <noscript>
    <img height="1" width="1" style="display:none"
      src="https://www.facebook.com/tr?id=1498332425017207&ev=PageView&noscript=1" />
  </noscript>

  <style>
    :root {
      --green: #25d366;
      --green-dark: #1fa855;
      --text: #1f1f1f;
      --subtext: #777;
      --bg: #f3f6f8;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(160deg, #edf7ef, #f3f6f8, #ffffff);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: var(--text);
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border-radius: 22px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.18);
      overflow: hidden;
    }

    .top-bar {
      height: 5px;
      background: linear-gradient(90deg, #25d366, #1ebe5c, #25d366);
    }

    .card-inner {
      padding: 24px 20px 22px;
      text-align: center;
    }

    .badge {
      display: inline-block;
      font-size: 13px;
      color: #444;
      background: #f4fbf6;
      border: 1px solid #d9f0df;
      border-radius: 999px;
      padding: 8px 14px;
      margin-bottom: 18px;
    }

    .icon-wechat {
      width: 64px;
      height: 64px;
      margin: 0 auto 14px;
      border-radius: 50%;
      background: var(--green);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 18px rgba(37, 211, 102, 0.28);
    }

    .icon-wechat svg {
      width: 34px;
      height: 34px;
      fill: #fff;
    }

    .title {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 14px;
      color: var(--subtext);
      margin-bottom: 18px;
      line-height: 1.6;
    }

    .wxid-box {
      background: #f7fdf9;
      border: 2px dashed #c8e6c9;
      border-radius: 14px;
      padding: 14px 12px;
      margin-bottom: 14px;
      transition: all 0.3s ease;
    }

    .wxid-box.copied-flash {
      border-color: var(--green);
      background: #eafcf0;
      box-shadow: 0 0 0 6px rgba(37, 211, 102, 0.08);
    }

    .wx-label {
      font-size: 12px;
      color: #888;
      margin-bottom: 6px;
    }

    .wxid {
      font-size: 30px;
      font-weight: 800;
      color: #245c2d;
      letter-spacing: 1px;
    }

    .copy-btn {
      width: 100%;
      border: none;
      border-radius: 999px;
      background: var(--green);
      color: #fff;
      font-size: 17px;
      font-weight: 700;
      padding: 14px 18px;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(37, 211, 102, 0.25);
      transition: transform 0.15s ease, background 0.2s ease;
    }

    .copy-btn:active {
      transform: scale(0.98);
      background: var(--green-dark);
    }

    .tips {
      margin-top: 14px;
      font-size: 14px;
      line-height: 1.7;
      color: #555;
    }

    .tips strong {
      color: #111;
    }

    .tips .code {
      color: var(--green-dark);
      font-weight: 700;
    }

    .gif-wrapper {
      margin-top: 18px;
      border-radius: 14px;
      overflow: hidden;
      background: #f7f7f7;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }

    .gif {
      display: block;
      width: 100%;
      height: auto;
    }

    .fallback {
      display: none;
      padding: 18px;
      font-size: 14px;
      color: #666;
      line-height: 1.7;
      text-align: center;
    }

    .toast {
      position: fixed;
      top: 22px;
      left: 50%;
      transform: translateX(-50%) translateY(-120px);
      background: #222;
      color: #fff;
      padding: 12px 20px;
      border-radius: 999px;
      font-size: 14px;
      z-index: 9999;
      transition: transform 0.35s ease;
      pointer-events: none;
      white-space: nowrap;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }

    .toast.success {
      background: var(--green);
    }

    @media (max-width: 420px) {
      .card-inner {
        padding: 22px 16px 18px;
      }

      .title {
        font-size: 24px;
      }

      .wxid {
        font-size: 28px;
      }

      .copy-btn {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="toast" id="toast"></div>

  <div class="card">
    <div class="top-bar"></div>

    <div class="card-inner">
      <div class="badge">👕 男装咨询 · 当天发货 · 专属优惠</div>

      <div class="icon-wechat">
        <svg viewBox="0 0 24 24">
          <path d="M8.69 11.66a1.1 1.1 0 1 1 0-2.2 1.1 1.1 0 0 1 0 2.2zm4.62 0a1.1 1.1 0 1 1 0-2.2 1.1 1.1 0 0 1 0 2.2zm-6.07 4.73c-3.96 0-7.18-3.22-7.18-7.18S3.28 2 7.24 2c3.7 0 6.75 2.8 7.1 6.37a7.4 7.4 0 0 0-1.67-.17c-4.08 0-7.4 3.3-7.4 7.38 0 1.5.45 2.9 1.22 4.06-.42-.03-.84-.08-1.25-.18v1.74c-2.12-.77-4.07-1.93-4.07-1.93s.03.03-.08-.03c-.9-.52-1.66-1.18-2.26-1.95a7.2 7.2 0 0 1-1.07-3.74c0-.56.06-1.1.19-1.62.38.1.78.17 1.19.2zm11.16 2.05c-2.2 0-4-1.78-4-3.98s1.8-3.98 4-3.98 4 1.78 4 3.98-1.8 3.98-4 3.98zm-1.5-3.18a.8.8 0 1 0 0-1.6.8.8 0 0 0 0 1.6zm3 0a.8.8 0 1 0 0-1.6.8.8 0 0 0 0 1.6z"/>
        </svg>
      </div>

      <div class="title">添加微信好友</div>
      <div class="subtitle">复制微信号后，打开微信搜索添加</div>

      <div class="wxid-box" id="wxidBox">
        <div class="wx-label">微信号</div>
        <div class="wxid" id="wxidText">N88385</div>
      </div>

      <button class="copy-btn" id="copyBtn">📋 点击复制微信号</button>

      <div class="tips">
        复制后打开微信 → 搜索添加<br />
        添加时发送暗号 <span class="code">【ins】</span> 获取专属优惠
      </div>

      <div class="gif-wrapper">
        <img
          class="gif"
          src="https://cdn.jsdelivr.net/gh/Jackayyy/AYTEAM@main/wx.GIF"
          alt="添加微信教程"
          onerror="this.style.display='none';document.getElementById('fallback').style.display='block';"
        />
        <div class="fallback" id="fallback">
          📱 打开微信 → 搜索 <strong>N88385</strong> → 添加好友
        </div>
      </div>
    </div>
  </div>

  <script>
    const WX_ID = 'N88385';
    const copyBtn = document.getElementById('copyBtn');
    const wxidBox = document.getElementById('wxidBox');
    const toast = document.getElementById('toast');
    let toastTimer;
    let hasFired = false;

    function showToast(message, type = '') {
      if (toastTimer) clearTimeout(toastTimer);
      toast.textContent = message;
      toast.className = 'toast ' + type + ' show';
      toastTimer = setTimeout(() => {
        toast.classList.remove('show');
      }, 2000);
    }

    function flashBox() {
      wxidBox.classList.add('copied-flash');
      setTimeout(() => {
        wxidBox.classList.remove('copied-flash');
      }, 500);
    }

    function fireAddEvent() {
      if (hasFired) return;
      hasFired = true;

      if (typeof fbq !== 'undefined') {
        fbq('trackCustom', 'add');
      }
    }

    function handleCopySuccess() {
      flashBox();
      showToast('✅ 已复制，请打开微信搜索添加', 'success');
      fireAddEvent();
    }

    function fallbackCopy() {
      const textarea = document.createElement('textarea');
      textarea.value = WX_ID;
      textarea.style.position = 'fixed';
      textarea.style.left = '-9999px';
      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();
      document.execCommand('copy');
      document.body.removeChild(textarea);
    }

    copyBtn.addEventListener('click', () => {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(WX_ID)
          .then(handleCopySuccess)
          .catch(() => {
            fallbackCopy();
            handleCopySuccess();
          });
      } else {
        fallbackCopy();
        handleCopySuccess();
      }
    });
  </script>
</body>
</html>
