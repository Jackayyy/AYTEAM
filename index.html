<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>添加微信好友</title>
    <style>
        :root { --green:#25d366; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; background:linear-gradient(160deg,#e8f5e9,#f0f2f5,#fff); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; user-select:none; }
        .card { background:#fff; border-radius:20px; padding:36px 28px 28px; max-width:400px; width:100%; box-shadow:0 4px 20px rgba(0,0,0,0.08); text-align:center; }
        .card::before { content:''; display:block; height:5px; background:linear-gradient(90deg,#25d366,#1ebe5c,#25d366); border-radius:20px 20px 0 0; margin:-36px -28px 20px -28px; }
        .icon-wechat { width:60px; height:60px; background:#25d366; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; margin-bottom:16px; box-shadow:0 4px 14px rgba(37,211,102,0.35); }
        .icon-wechat svg { width:34px; height:34px; fill:#fff; }
        .title { font-size:22px; font-weight:700; color:#1a1a1a; margin-bottom:6px; }
        .subtitle { font-size:14px; color:#888; margin-bottom:20px; }
        .wxid-box { background:#f7fdf9; border:2px dashed #c8e6c9; border-radius:12px; padding:16px; margin-bottom:12px; transition:all 0.3s; }
        .wxid-box.copied-flash { border-color:#25d366; background:#e8fcef; animation:pulse 0.5s ease; }
        @keyframes pulse { 0%,100%{ box-shadow:0 0 0 0 rgba(37,211,102,0.4); } 50%{ box-shadow:0 0 0 14px rgba(37,211,102,0); } }
        .wxid { font-size:28px; font-weight:700; color:#2c5f2d; }
        .copy-btn { display:inline-flex; align-items:center; gap:8px; background:#25d366; color:#fff; border:none; padding:14px 36px; border-radius:30px; font-size:17px; font-weight:600; cursor:pointer; box-shadow:0 4px 16px rgba(37,211,102,0.3); margin-top:10px; }
        .copy-btn:active { transform:scale(0.96); }
        .gif-wrapper { border-radius:12px; overflow:hidden; box-shadow:0 2px 12px rgba(0,0,0,0.08); margin-top:16px; }
        .gif { max-width:100%; width:320px; display:block; margin:0 auto; }
        .toast { position:fixed; top:24px; left:50%; transform:translateX(-50%) translateY(-120px); background:#333; color:#fff; padding:12px 24px; border-radius:30px; font-size:15px; z-index:999; transition:transform 0.35s ease; pointer-events:none; }
        .toast.show { transform:translateX(-50%) translateY(0); }
        .toast.success { background:#25d366; }
        .fallback-text { display:none; padding:20px; color:#666; font-size:14px; text-align:center; }
    </style>
</head>
<body>
    <div class="toast" id="toast"></div>
    <div class="card">
        <div class="icon-wechat"><svg viewBox="0 0 24 24"><path d="M8.69 11.66a1.1 1.1 0 1 1 0-2.2 1.1 1.1 0 0 1 0 2.2zm4.62 0a1.1 1.1 0 1 1 0-2.2 1.1 1.1 0 0 1 0 2.2zm-6.07 4.73c-3.96 0-7.18-3.22-7.18-7.18S3.28 2 7.24 2c3.7 0 6.75 2.8 7.1 6.37a7.4 7.4 0 0 0-1.67-.17c-4.08 0-7.4 3.3-7.4 7.38 0 1.5.45 2.9 1.22 4.06-.42-.03-.84-.08-1.25-.18v1.74c-2.12-.77-4.07-1.93-4.07-1.93s.03.03-.08-.03c-.9-.52-1.66-1.18-2.26-1.95a7.2 7.2 0 0 1-1.07-3.74c0-.56.06-1.1.19-1.62.38.1.78.17 1.19.2zm11.16 2.05c-2.2 0-4-1.78-4-3.98s1.8-3.98 4-3.98 4 1.78 4 3.98-1.8 3.98-4 3.98zm-1.5-3.18a.8.8 0 1 0 0-1.6.8.8 0 0 0 0 1.6zm3 0a.8.8 0 1 0 0-1.6.8.8 0 0 0 0 1.6z"/></svg></div>
        <div class="title">添加微信好友</div>
        <div class="subtitle">扫码或搜索微信号添加</div>
        <div class="wxid-box" id="wxidBox">
            <div style="font-size:12px;color:#999;">微信号</div>
            <div class="wxid" id="wxidText">N88385</div>
        </div>
        <button class="copy-btn" id="copyBtn">📋 点击复制微信号</button>
        <div class="gif-wrapper" id="gifWrapper">
            <!-- 主图：使用 jsdelivr CDN，国内速度快 -->
            <img class="gif" id="gifImg"
                 src="https://cdn.jsdelivr.net/gh/Jackayyy/AYTEAM@main/wx.GIF"
                 alt="添加微信教程"
                 loading="eager"
                 onerror="handleGifError()">
            <div class="fallback-text" id="fallbackText">
                📱 请打开微信<br>点击右上角 ➕<br>选择「添加朋友」<br>搜索 <strong>N88385</strong>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCtopFoYuxVxW5nkvX5wML4ckk25Pgqzws",
            authDomain: "aayy-636ae.firebaseapp.com",
            projectId: "aayy-636ae",
            storageBucket: "aayy-636ae.firebasestorage.app",
            messagingSenderId: "1042761346693",
            appId: "1:1042761346693:web:48505c61668587c4dcc3ec"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        function getDateKey() {
            const d = new Date();
            return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
        }

        async function incrementCount() {
            const dateKey = getDateKey();
            const docRef = doc(db, "daily_counts", dateKey);
            try {
                await updateDoc(docRef, { count: increment(1) });
                console.log('✅ 远程计数已更新');
            } catch (e) {
                await setDoc(docRef, { count: 1 });
                console.log('✅ 远程计数已创建');
            }
        }

        async function getRemoteCount() {
            const dateKey = getDateKey();
            const snap = await getDoc(doc(db, "daily_counts", dateKey));
            return snap.exists() ? snap.data().count : 0;
        }

        // GIF 加载失败时显示文字教程
        window.handleGifError = function() {
            document.getElementById('gifImg').style.display = 'none';
            document.getElementById('fallbackText').style.display = 'block';
            // 还可以尝试第二个备用链接
            const backupImg = new Image();
            backupImg.onload = function() {
                document.getElementById('gifImg').src = 'https://raw.githubusercontent.com/Jackayyy/AYTEAM/41813440d12dc125c14dd6c3abeda9f8d864c8f7/wx.GIF';
                document.getElementById('gifImg').style.display = 'block';
                document.getElementById('fallbackText').style.display = 'none';
            };
            backupImg.src = 'https://raw.githubusercontent.com/Jackayyy/AYTEAM/41813440d12dc125c14dd6c3abeda9f8d864c8f7/wx.GIF';
        };

        const WX_ID = 'N88385';
        const copyBtn = document.getElementById('copyBtn');
        const wxidBox = document.getElementById('wxidBox');
        const wxidText = document.getElementById('wxidText');
        const toast = document.getElementById('toast');
        let toastTimer;

        function showToast(msg, type='') {
            if(toastTimer) clearTimeout(toastTimer);
            toast.textContent = msg;
            toast.className = 'toast ' + type + ' show';
            toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function flashBox() {
            wxidBox.classList.add('copied-flash');
            setTimeout(() => wxidBox.classList.remove('copied-flash'), 600);
        }

        async function handleCopy() {
            flashBox();
            showToast('✅ 已复制！请打开微信搜索添加好友', 'success');
            await incrementCount();
            const total = await getRemoteCount();
            console.log('📊 当前总复制次数：' + total);
        }

        copyBtn.addEventListener('click', () => {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(WX_ID).then(handleCopy).catch(() => {
                    const ta = document.createElement('textarea');
                    ta.value = WX_ID; ta.style.position='fixed'; ta.style.left='-9999px';
                    document.body.appendChild(ta); ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                    handleCopy();
                });
            }
        });

        wxidText.addEventListener('copy', (e) => {
            e.preventDefault();
            if(e.clipboardData) e.clipboardData.setData('text/plain', WX_ID);
            handleCopy();
        });

        // 连点空白处3次查看总次数
        let clickCount = 0, clickTimer = null;
        function onBlankTap(e) {
            if(e.target.closest('button')) return;
            clickCount++;
            clearTimeout(clickTimer);
            clickTimer = setTimeout(async () => {
                if(clickCount >= 3) {
                    const count = await getRemoteCount();
                    alert('📊 今日总复制次数：' + count + ' 次（跨设备同步）');
                }
                clickCount = 0;
            }, 1500);
        }
        document.addEventListener('click', onBlankTap);
        document.addEventListener('touchstart', onBlankTap, { passive: true });

        console.log('✅ 页面已启动');
    </script>
</body>
</html>
